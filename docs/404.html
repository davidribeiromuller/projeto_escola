<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FUJA DA SOLANGE!!</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      // Converts 404 path into a query parameter and redirects to index.html
      var pathSegmentsToKeep = 1; // 1 for project pages (e.g. username.github.io/repo-name)
      var l = window.location;
      var repoSegment = l.pathname.split('/')[1] || '';
      var queryParam = '?mode=' + (l.pathname.includes('controle') ? 'controle' : 'redirect') +
        '&path=' + encodeURIComponent(l.pathname.slice(1)) +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash;
      
      var newUrl = l.protocol + '//' + l.host + '/' + repoSegment + '/' + queryParam;
      l.replace(newUrl);
    </script>
  </head>
  <body style="background:#07090e; color:#f59e0b; font-family:monospace; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
    <p>Carregando FUJA DA SOLANGE!!...</p>
  </body>
</html>
