    <script>
      (function() {
        try {
          // Normalize trailing slash for GitHub Pages project root (e.g. /repo -> /repo/)
          // This prevents relative asset paths (./assets/...) from resolving to root domain
          var p = window.location.pathname;
          if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
            window.location.replace(p + '/' + window.location.search + window.location.hash);
          }
        } catch (e) {
          console.warn('Navigation normalization note:', e);
        }
      })();
    </script>

    <script>
      (function() {
        try {
          // If deployed directly from git root branch to GitHub Pages without GitHub Actions build,
          // automatically redirect to the pre-built /docs/ folder where the compiled bundle lives
          var isGitHubPages = window.location.hostname.endsWith('github.io');
          var p = window.location.pathname;
          if (isGitHubPages && !p.includes('/docs') && !p.includes('/dist')) {
            // Check if this is the unbundled root index.html (no built assets in head)
            var hasBundledScript = document.querySelector('script[src*="assets/"]') || document.querySelector('link[href*="assets/"]');
            if (!hasBundledScript) {
              var targetDocs = (p.endsWith('/') ? p : p + '/') + 'docs/' + window.location.search + window.location.hash;
              window.location.replace(targetDocs);
            }
          }
        } catch (e) {
          console.warn('Docs redirect note:', e);
        }
      })();
    </script>
